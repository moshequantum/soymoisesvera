<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 1200px;
      height: 320px;
      background-color: #08070C;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', sans-serif;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 40px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
    }

    /* Ambient Cosmic Glow (Subtle & Diffused) */
    .ambient-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 750px;
      height: 220px;
      background: radial-gradient(ellipse at center, rgba(147, 51, 234, 0.16) 0%, rgba(82, 39, 255, 0.08) 45%, transparent 75%);
      filter: blur(40px);
      pointer-events: none;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Pill Tag */
    .top-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #D4D4D8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #c084fc;
      box-shadow: 0 0 8px #c084fc;
    }

    /* Name Headline */
    .name-title {
      font-size: 44px;
      font-weight: 700;
      letter-spacing: -1.2px;
      color: #FFFFFF;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    /* Editorial Statement */
    .statement {
      font-size: 21px;
      font-weight: 400;
      color: #E4E4E7;
      letter-spacing: -0.3px;
      margin-bottom: 22px;
    }

    .statement .serif-italic {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      color: #FFFFFF;
      padding-right: 2px;
    }

    /* Metadata Bar */
    .metadata-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #9894AA;
      letter-spacing: 1px;
    }

    .metadata-bar .sep {
      color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="content">
    <div class="top-pill">
      <span class="pill-dot"></span>
      <span>FOUNDING PRODUCT ENGINEER · MULTIVERSA GROUP</span>
    </div>

    <h1 class="name-title">Moisés David Vera</h1>

    <p class="statement">
      <span class="serif-italic">Llevo productos digitales</span> de la idea a producción.
    </p>

    <div class="metadata-bar">
      <span>AI-NATIVE EXECUTION</span>
      <span class="sep">•</span>
      <span>DESIGN SYSTEMS</span>
      <span class="sep">•</span>
      <span>EDGE ARCHITECTURE</span>
      <span class="sep">•</span>
      <span>16+ YEARS CRAFT</span>
    </div>
  </div>
</body>
</html>
