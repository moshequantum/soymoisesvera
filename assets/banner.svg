<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- True Cosmic Night Canvas Gradient -->
    <linearGradient id="cosmicBg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08070D" />
      <stop offset="50%" stop-color="#0E0C17" />
      <stop offset="100%" stop-color="#07060B" />
    </linearGradient>

    <!-- Electric Indigo / Violet Glow (#5227FF & #c084fc) -->
    <radialGradient id="electricVioletGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160, 60) rotate(45) scale(320)">
      <stop offset="0%" stop-color="#5227FF" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#5227FF" stop-opacity="0" />
    </radialGradient>

    <!-- Warm Amber / Gold Accent Glow (#d4a359) -->
    <radialGradient id="goldAccentGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080, 100) rotate(135) scale(300)">
      <stop offset="0%" stop-color="#d4a359" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#d4a359" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#d4a359" stop-opacity="0" />
    </radialGradient>

    <!-- Scanner Mesh Beam -->
    <linearGradient id="scannerBeam" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(82, 39, 255, 0)" />
      <stop offset="25%" stop-color="rgba(192, 132, 252, 0.18)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.25)" />
      <stop offset="75%" stop-color="rgba(212, 163, 89, 0.15)" />
      <stop offset="100%" stop-color="rgba(82, 39, 255, 0)" />
    </linearGradient>

    <!-- Technical Fine Grid Pattern -->
    <pattern id="cosmicGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.022)" stroke-width="1" />
      <circle cx="0" cy="0" r="0.8" fill="rgba(192, 132, 252, 0.25)" />
    </pattern>

    <!-- Cosmic Card Border with Violet/Gold shimmer -->
    <linearGradient id="cosmicBorder" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(192, 132, 252, 0.5)" />
      <stop offset="30%" stop-color="rgba(82, 39, 255, 0.3)" />
      <stop offset="70%" stop-color="rgba(212, 163, 89, 0.4)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.08)" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; }
    .sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
    .serif-italic { font-family: 'Newsreader', Georgia, serif; font-style: italic; }
    .title { font-weight: 700; letter-spacing: -0.5px; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="20" fill="url(#cosmicBg)" />
  <rect width="1200" height="360" rx="20" fill="url(#cosmicGrid)" />
  <rect width="1200" height="360" rx="20" fill="url(#electricVioletGlow)" />
  <rect width="1200" height="360" rx="20" fill="url(#goldAccentGlow)" />
  
  <!-- Subtle Horizontal Scanner Trace -->
  <line x1="20" y1="180" x2="1180" y2="180" stroke="url(#scannerBeam)" stroke-width="0.8" opacity="0.6" />
  
  <!-- Outer Stroke -->
  <rect width="1200" height="360" rx="20" stroke="url(#cosmicBorder)" stroke-width="1.2" fill="none" />

  <!-- TOP BAR: Multiversa Group Brand + Live Status -->
  <g transform="translate(60, 40)">
    <!-- Multiversa Monogram (Electric Violet & White) -->
    <circle cx="16" cy="16" r="16" fill="#1C182B" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" />
    <path d="M12 21H9L10.2 11H13.2L12 21Z" fill="#c084fc" />
    <path d="M16.5 21H13.5L14.7 11H17.7L16.5 21Z" fill="#c084fc" />
    <path d="M21 21H18L19.2 11H20.2C21.8 11 22.8 12.2 22.5 13.8L21 21Z" fill="#c084fc" />

    <text x="44" y="21" fill="#F8F7FC" class="mono" font-size="12" font-weight="700" letter-spacing="2">MULTIVERSA GROUP</text>
    <text x="200" y="21" fill="rgba(255,255,255,0.25)" class="mono" font-size="12">|</text>
    <text x="216" y="21" fill="#9894AA" class="mono" font-size="11" letter-spacing="1">SOVEREIGN PRODUCT LAB</text>
  </g>

  <!-- Live Status Pill (Top Right, Cosmic Purple & Mint Live Indicator) -->
  <g transform="translate(860, 40)">
    <rect width="280" height="32" rx="16" fill="rgba(192, 132, 252, 0.08)" stroke="rgba(192, 132, 252, 0.25)" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#c084fc" />
    <circle cx="20" cy="16" r="8" fill="#c084fc" opacity="0.25" />
    <text x="36" y="20" fill="#E2DCF7" class="mono" font-size="11" font-weight="600" letter-spacing="0.8">AVAILABLE FOR CONTRACTS</text>
  </g>

  <!-- MAIN HERO SECTION -->
  <g transform="translate(60, 110)">
    <!-- Eyebrow Pill -->
    <g transform="translate(0, 0)">
      <rect width="295" height="26" rx="6" fill="rgba(82, 39, 255, 0.12)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1" />
      <text x="12" y="17" fill="#c084fc" class="mono" font-size="11" font-weight="600" letter-spacing="0.5">FOUNDING PRODUCT ENGINEER</text>
      <text x="220" y="17" fill="#d4a359" class="mono" font-size="11" font-weight="600" letter-spacing="0.5">· 0 → 1</text>
    </g>

    <!-- Full Name in Ivory White -->
    <text x="0" y="68" fill="#F8F7FC" class="sans title" font-size="44">Moisés David Vera</text>

    <!-- Subtitle: Editorial Blend (Sans + Serif Italic in Gold) -->
    <text x="0" y="105" fill="#E2DCF7" class="sans" font-size="18" font-weight="600">
      AI-Native Builder &amp; Design Engineer <tspan fill="#d4a359" class="serif-italic" font-weight="400">· 16+ Years Product Judgment, UI &amp; Edge</tspan>
    </text>

    <!-- Body Tagline in Muted Sand / Lavender Slate -->
    <text x="0" y="132" fill="#9894AA" class="sans" font-size="14" font-weight="400">
      Turning complex founder requirements into shipped, reliable production software at extreme velocity.
    </text>
  </g>

  <!-- BOTTOM 4 CAPABILITY PILLARS (Aligned with Cosmic Night Cards) -->
  <g transform="translate(60, 278)">
    <!-- Pillar 1: 0 to 1 Speed -->
    <g transform="translate(0, 0)">
      <rect width="255" height="44" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(192, 132, 252, 0.15)" stroke-width="1" />
      <text x="14" y="27" fill="#F8F7FC" class="mono" font-size="11" font-weight="600">⚡ 0 → 1 Rapid Shipping</text>
      <text x="175" y="27" fill="#9894AA" class="mono" font-size="10">React · Svelte</text>
    </g>

    <!-- Pillar 2: Pragmatic AI & HITL -->
    <g transform="translate(275, 0)">
      <rect width="270" height="44" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(192, 132, 252, 0.15)" stroke-width="1" />
      <text x="14" y="27" fill="#F8F7FC" class="mono" font-size="11" font-weight="600">🤖 Pragmatic AI &amp; HITL</text>
      <text x="180" y="27" fill="#9894AA" class="mono" font-size="10">Telegram · Tools</text>
    </g>

    <!-- Pillar 3: Edge & Zero-Retention -->
    <g transform="translate(565, 0)">
      <rect width="265" height="44" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(192, 132, 252, 0.15)" stroke-width="1" />
      <text x="14" y="27" fill="#F8F7FC" class="mono" font-size="11" font-weight="600">🛡️ Edge &amp; Zero-Retention</text>
      <text x="195" y="27" fill="#9894AA" class="mono" font-size="10">Workers · Zod</text>
    </g>

    <!-- Pillar 4: Verified Chops -->
    <g transform="translate(850, 0)">
      <rect width="230" height="44" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(212, 163, 89, 0.25)" stroke-width="1" />
      <text x="14" y="27" fill="#F8F7FC" class="mono" font-size="11" font-weight="600">🏆 HackerRank Verified</text>
      <text x="175" y="27" fill="#d4a359" class="mono" font-size="10">React · SQL</text>
    </g>
  </g>
</svg>
