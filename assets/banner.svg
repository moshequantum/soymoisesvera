<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08090C" />
      <stop offset="50%" stop-color="#0B0D14" />
      <stop offset="100%" stop-color="#07080A" />
    </linearGradient>

    <!-- Radial Glow: Multiversa Lime -->
    <radialGradient id="limeGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180, 80) rotate(45) scale(260)">
      <stop offset="0%" stop-color="#BDEB34" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#BDEB34" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#BDEB34" stop-opacity="0" />
    </radialGradient>

    <!-- Radial Glow: Deep Blue / Indigo -->
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1060, 100) rotate(135) scale(340)">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#1D4ED8" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Technical Grid Pattern -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1" />
    </pattern>

    <!-- Linear Glow Line for Card Top -->
    <linearGradient id="glowBorder" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(189, 235, 52, 0.4)" />
      <stop offset="35%" stop-color="rgba(255, 255, 255, 0.15)" />
      <stop offset="70%" stop-color="rgba(29, 78, 216, 0.4)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace; }
    .sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; letter-spacing: -1px; }
    .role-title { font-weight: 700; letter-spacing: 0.5px; }
    .tag { font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
    .status-text { font-size: 11px; font-weight: 600; letter-spacing: 1px; }
  </style>

  <!-- Base Card Background with Rounded Corners -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="20" fill="url(#gridPattern)" />
  <rect width="1200" height="360" rx="20" fill="url(#limeGlow)" />
  <rect width="1200" height="360" rx="20" fill="url(#blueGlow)" />
  <rect width="1200" height="360" rx="20" stroke="url(#glowBorder)" stroke-width="1.5" fill="none" />

  <!-- TOP BAR: Brand Monogram + Live Availability Status -->
  <g transform="translate(60, 42)">
    <!-- Multiversa Icon -->
    <circle cx="16" cy="16" r="16" fill="#BDEB34" />
    <path d="M12.48 21.36H8.52L10.01 10.64H13.97L12.48 21.36Z" fill="#0A0A0F" />
    <path d="M17.43 21.36H13.47L14.96 10.64H18.92L17.43 21.36Z" fill="#0A0A0F" />
    <path d="M22.38 21.36H18.42L19.9 10.64H20.86C22.45 10.64 23.67 12.04 23.45 13.62L22.38 21.36Z" fill="#0A0A0F" />

    <text x="44" y="21" fill="#FFFFFF" class="mono" font-size="12" font-weight="700" letter-spacing="2">MULTIVERSA GROUP</text>
    <text x="195" y="21" fill="rgba(255,255,255,0.3)" class="mono" font-size="12">|</text>
    <text x="212" y="21" fill="#A1A1AA" class="mono" font-size="11" letter-spacing="1">SOVEREIGN PRODUCT LAB</text>
  </g>

  <!-- Live Status Pill (Top Right) -->
  <g transform="translate(850, 42)">
    <rect width="290" height="32" rx="16" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <circle cx="20" cy="16" r="4.5" fill="#10B981" />
    <circle cx="20" cy="16" r="8" fill="#10B981" opacity="0.25" />
    <text x="36" y="20" fill="#34D399" class="mono status-text">AVAILABLE FOR CONTRACTOR ROLES</text>
  </g>

  <!-- MAIN CENTER HERO -->
  <g transform="translate(60, 115)">
    <!-- Eyebrow Tag -->
    <g transform="translate(0, 0)">
      <rect width="275" height="26" rx="6" fill="rgba(189, 235, 52, 0.1)" stroke="rgba(189, 235, 52, 0.35)" stroke-width="1" />
      <text x="12" y="17" fill="#BDEB34" class="mono tag">FOUNDING PRODUCT ENGINEER</text>
      <text x="205" y="17" fill="#E4E4E7" class="mono tag">· 0 → 1 SPEED</text>
    </g>

    <!-- Candidate Name -->
    <text x="0" y="70" fill="#FFFFFF" class="sans title" font-size="44">Moisés David Vera</text>

    <!-- Subtitle / Positioning -->
    <text x="0" y="105" fill="#E2E8F0" class="sans role-title" font-size="18">
      AI-Native Builder &amp; Design Engineer <tspan fill="#64748B" font-weight="400">· 16+ Years Bridging Product Judgment, UI &amp; Edge</tspan>
    </text>

    <text x="0" y="130" fill="#94A3B8" class="sans" font-size="14" font-weight="400">
      Turning complex founder requirements into shipped, reliable production software at extreme velocity without handoff friction.
    </text>
  </g>

  <!-- BOTTOM CAPABILITIES BAR (Grid of 4 Core Pillars) -->
  <g transform="translate(60, 280)">
    <!-- Pillar 1: 0 to 1 Speed -->
    <g transform="translate(0, 0)">
      <rect width="255" height="42" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="14" y="26" fill="#F8FAFC" class="mono" font-size="11" font-weight="600">⚡ 0 → 1 Rapid Shipping</text>
      <text x="170" y="26" fill="#64748B" class="mono" font-size="10">React · Svelte</text>
    </g>

    <!-- Pillar 2: Pragmatic AI & HITL -->
    <g transform="translate(275, 0)">
      <rect width="270" height="42" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="14" y="26" fill="#F8FAFC" class="mono" font-size="11" font-weight="600">🤖 Pragmatic AI &amp; HITL</text>
      <text x="180" y="26" fill="#64748B" class="mono" font-size="10">Telegram · Tools</text>
    </g>

    <!-- Pillar 3: Edge & Zero-Retention -->
    <g transform="translate(565, 0)">
      <rect width="265" height="42" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="14" y="26" fill="#F8FAFC" class="mono" font-size="11" font-weight="600">🛡️ Edge &amp; Zero-Retention</text>
      <text x="195" y="26" fill="#64748B" class="mono" font-size="10">Workers · Zod</text>
    </g>

    <!-- Pillar 4: Verified Chops -->
    <g transform="translate(850, 0)">
      <rect width="230" height="42" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="14" y="26" fill="#F8FAFC" class="mono" font-size="11" font-weight="600">🏆 HackerRank Verified</text>
      <text x="175" y="26" fill="#64748B" class="mono" font-size="10">React · SQL</text>
    </g>
  </g>
</svg>
