<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500;1,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 1584px;
      height: 396px;
      background-color: #08070C;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', sans-serif;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      /* Zona segura de avatar a la izquierda: dejamos 360px libres */
      padding-left: 360px;
      padding-right: 120px;
    }

    /* Resplandor cósmico difuso y elegante */
    .ambient-glow {
      position: absolute;
      top: 50%;
      left: 65%;
      transform: translate(-50%, -50%);
      width: 850px;
      height: 280px;
      background: radial-gradient(ellipse at center, rgba(147, 51, 234, 0.16) 0%, rgba(82, 39, 255, 0.07) 50%, transparent 75%);
      filter: blur(50px);
      pointer-events: none;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 1050px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    /* Pill superior minimalista */
    .top-pill {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 6px 16px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #D4D4D8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #c084fc;
      box-shadow: 0 0 8px #c084fc;
    }

    /* Propuesta de valor: Noticias editoriales + Sans moderna */
    .value-headline {
      font-size: 46px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -1px;
      color: #FFFFFF;
      margin-bottom: 24px;
    }

    .value-headline .serif-italic {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      color: #FFFFFF;
      letter-spacing: -0.3px;
    }

    /* Metadatos técnicos de apoyo */
    .meta-track {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #9894AA;
      letter-spacing: 1.2px;
    }

    .meta-track .sep {
      color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="content">
    <div class="top-pill">
      <span class="pill-dot"></span>
      <span>FOUNDING PRODUCT DELIVERY · 0 → 1</span>
    </div>

    <h1 class="value-headline">
      <span class="serif-italic">Llevo productos digitales</span> de la idea a producción.
    </h1>

    <div class="meta-track">
      <span>AI-NATIVE EXECUTION</span>
      <span class="sep">•</span>
      <span>DESIGN SYSTEMS</span>
      <span class="sep">•</span>
      <span>EDGE ARCHITECTURE</span>
      <span class="sep">•</span>
      <span>MULTIVERSA.GROUP</span>
    </div>
  </div>
</body>
</html>
